name: Check theme

on:
  push:
    branches: [main, port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: npm run build
      - name: Validate
        run: npm run validate
      - name: Verify dist is committed and up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ does not match src/ — run npm run build and commit dist/"
            git status --porcelain dist
            exit 1
          fi
